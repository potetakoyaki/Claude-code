name: Build Android APK

on:
  push:
    branches: [main, claude/task-management-app-clq0ye]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Add share (ACTION_SEND) intent-filter to manifest
        run: node scripts/patch-android-manifest.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk yarukoto.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yarukoto-apk
          path: yarukoto.apk

      # スマホからワンタップで入れられるよう、Release にも APK を添付する
      - name: Publish APK to a rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: やること Android APK（最新）
          body: |
            最新のデバッグ用APKです。Androidのブラウザで `yarukoto.apk` をタップしてインストールしてください。
            初回は「提供元不明のアプリ / 不明なアプリのインストール」を許可する必要があります。
          prerelease: true
          files: yarukoto.apk
